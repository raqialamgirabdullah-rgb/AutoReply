name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        shell: bash
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: echo "$KS_BASE64" | base64 -d > app/autoreply.keystore

      - name: Build release APK
        shell: bash
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          VC=$((100 + ${{ github.run_number }}))
          echo "VC=$VC" >> "$GITHUB_ENV"
          gradle --no-daemon --stacktrace -Pvc=$VC assembleRelease 2>&1 | tee build.log

      - name: Publish APK to a GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AutoReply.apk
          gh release create "v1.0.$VC" AutoReply.apk --title "AutoReply v1.0.$VC" --notes "Download AutoReply.apk and install it. Installed copies show an update button inside the app." --latest

      - name: Save build error log (branch build-logs)
        if: failure()
        shell: bash
        run: |
          tail -n 150 build.log > /tmp/build-error.log 2>/dev/null || echo "no build log" > /tmp/build-error.log
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan build-logs
          git rm -rf . -q
          cp /tmp/build-error.log build-error.log
          git add build-error.log
          git commit -q -m "build log run ${{ github.run_number }}"
          git push -f origin build-logs
