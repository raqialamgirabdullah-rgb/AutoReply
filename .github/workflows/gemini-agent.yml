name: Gemini Agent

# ইস্যু বা পুল রিকোয়েস্টের কমেন্টে "@gemini-cli <কাজ>" লিখলে Gemini কাজটা করে নতুন ব্রাঞ্চে পুল রিকোয়েস্ট খোলে।
# শুধু রিপোজিটরির মালিক চালাতে পারবে; main-এ সরাসরি কিছু পুশ হয় না (আপনি দেখে মার্জ করবেন)।
on:
  issue_comment:
    types: [created]

concurrency:
  group: gemini-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gemini:
    if: >-
      startsWith(github.event.comment.body, '@gemini-cli') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "gemini-agent"
          git config user.email "gemini-agent@users.noreply.github.com"

      - name: Check Gemini key and pick a working model
        id: keycheck
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # কোডিংয়ের জন্য সবচেয়ে শক্তিশালী মডেল আগে (gemini-4-argon, তারপর Pro); কোটা শেষ বা চাপ বেশি হলে (429/503) বা মডেল না থাকলে (404) পরেরটা চেষ্টা হয়, শেষে Flash
          chosen=""; report=""
          for m in gemini-4-argon gemini-3.1-pro-preview gemini-2.5-pro gemini-flash-latest gemini-flash-lite-latest gemini-2.5-flash-lite gemini-2.5-flash; do
            code=$(curl -s -m 40 -o /tmp/r.json -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' -d '{"contents":[{"parts":[{"text":"hi"}]}]}' "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" || echo 000)
            report="$report$m=$code; "
            if [ "$code" = "200" ] && [ -z "$chosen" ]; then chosen="$m"; fi
          done
          echo "model=$chosen" >> "$GITHUB_OUTPUT"
          echo "models=$report" >> "$GITHUB_OUTPUT"
          echo "Gemini key check: $report -> chosen: ${chosen:-none}"

      - name: Allow git/gh/read-only shell for Gemini in headless mode
        run: |
          mkdir -p "$HOME/.gemini/policies"
          cat > "$HOME/.gemini/policies/ci.toml" <<'TOML'
          [[rule]]
          toolName = "run_shell_command"
          commandPrefix = ["git push origin main", "git push origin HEAD:main", "git push --force", "git push -f", "gh workflow", "gh secret"]
          decision = "deny"
          priority = 300

          [[rule]]
          toolName = "run_shell_command"
          commandPrefix = ["git", "gh", "ls", "cat", "grep", "sed", "echo", "head", "tail", "wc", "pwd"]
          decision = "allow"
          priority = 200
          allowRedirection = true
          TOML

      - name: Run Gemini
        id: gemini
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"   # CI-তে ফোল্ডার বিশ্বস্ত না হলে Gemini CLI কাজ শুরুই করে না
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ steps.keycheck.outputs.model || 'gemini-flash-latest' }}
          settings: |-
            {
              "tools": {
                "core": [
                  "read_file", "write_file", "replace", "glob", "search_file_content", "list_directory",
                  "run_shell_command(git)", "run_shell_command(gh)", "run_shell_command(ls)",
                  "run_shell_command(cat)", "run_shell_command(grep)", "run_shell_command(sed)"
                ]
              },
              "coreTools": [
                "read_file", "write_file", "replace", "glob", "search_file_content", "list_directory",
                "run_shell_command(git)", "run_shell_command(gh)", "run_shell_command(ls)",
                "run_shell_command(cat)", "run_shell_command(grep)", "run_shell_command(sed)"
              ]
            }
          prompt: |-
            তুমি এই রিপোজিটরির (Android/Kotlin অ্যাপ) একজন ডেভেলপার। আগে GEMINI.md পড়ো এবং তার নিয়ম মেনে চলো।
            ব্যবহারকারীর কাজ (শুরুর "@gemini-cli" বাদ দিয়ে পড়ো): ${{ github.event.comment.body }}
            ইস্যু নম্বর ${{ github.event.issue.number }}, রিপো ${{ github.repository }}। নিচের ধাপগুলোতে $ISSUE_NUMBER মানে এই ইস্যু নম্বর (${{ github.event.issue.number }})।
            ধাপগুলো:
            1. `git checkout -b gemini/issue-$ISSUE_NUMBER` দিয়ে নতুন ব্রাঞ্চ খোলো।
            2. কাজটা সবচেয়ে ছোট ও নিরাপদ বদলে করো। শুধু যা দরকার সেটুকু ফাইল বদলাও।
            3. কমিট করো এবং `git push -u origin HEAD` দিয়ে ব্রাঞ্চটা পুশ করো।
            4. `gh pr create --base main --fill` দিয়ে পুল রিকোয়েস্ট খোলো।
            5. `gh issue comment $ISSUE_NUMBER --body "<কী করলে ও কেন, এক-দুই লাইনে>"` দিয়ে সারসংক্ষেপ জানাও।
            কঠোর নিষেধ: main-এ সরাসরি পুশ নয়; .github/workflows, সাইনিং-সংক্রান্ত ফাইল, বা কোনো সিক্রেট ছোঁবে না।
            কাজটা করা সম্ভব না হলে কোড না বদলে ইস্যুতে কমেন্ট করে কারণ জানাও।

      - name: Report result to the issue
        id: report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.gemini.outcome }}
          KEY_MODELS: ${{ steps.keycheck.outputs.models }}
          KEY_MODEL: ${{ steps.keycheck.outputs.model }}
          G_ERROR: ${{ steps.gemini.outputs.error }}
          G_SUMMARY: ${{ steps.gemini.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PRS=$(gh pr list --head "gemini/issue-$ISSUE_NUMBER" --state open --json number --jq length 2>/dev/null || echo 0)
          if [ "$OUTCOME" = "success" ] && [ "${PRS:-0}" -gt 0 ]; then echo "nopr=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "nopr=true" >> "$GITHUB_OUTPUT"
          READABLE=$(printf '%s' "$KEY_MODELS" | sed -e 's/=200/=ঠিক/g' -e 's/=429/=কোটা শেষ/g' -e 's/=404/=নেই/g' -e 's/=503/=ব্যস্ত/g' -e 's/=0000*/=সাড়া নেই/g')
          {
            if [ "${PRS:-0}" -eq 0 ]; then echo "⚠ কাজ হয়নি — Gemini কোনো বদল (Pull Request) করেনি।"; else echo "Gemini রান: **$OUTCOME**"; fi
            echo "ব্যবহৃত মডেল: ${KEY_MODEL:-কোনোটিই কাজ করেনি}"
            echo "মডেলের অবস্থা: ${READABLE:-?}"
            case "$KEY_MODELS" in *gemini-4-argon=429*|*gemini-3.1-pro-preview=429*) echo "শক্তিশালী মডেলের কোটা শেষ, তাই হালকা মডেল ব্যবহার হয়েছে — জটিল কাজ ঠিকমতো না-ও হতে পারে।" ;; esac
            if [ -n "$G_ERROR" ]; then echo; echo "ত্রুটি:"; echo '```'; printf '%s' "$G_ERROR" | grep -v 'at ' | tail -c 1500; echo; echo '```'; fi
            case "$G_SUMMARY" in "{"*|"") ;; *) echo; echo "আউটপুট:"; echo '```'; printf '%s' "$G_SUMMARY" | head -c 800; echo; echo '```' ;; esac
            echo; echo "[রানের লিংক]($RUN_URL)"
          } > /tmp/report.md
          python3 - >> /tmp/report.md <<'PY'
          import glob, json
          for f in sorted(glob.glob('/tmp/gemini-client-error-*.json'))[:1]:
              try:
                  d = json.load(open(f))
                  e = d.get('error', d)
                  keep = {k: e.get(k) for k in ('message', 'type', 'status', 'code') if isinstance(e, dict) and k in e}
                  text = json.dumps(keep or e, ensure_ascii=False)
              except Exception as ex:
                  text = 'unreadable: ' + str(ex)
              print('\nসম্পূর্ণ ত্রুটি-রিপোর্ট (ছোট করা):\n```\n' + text[:1800] + '\n```')
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/report.md

      # মালিক জানিয়েছেন মার্জ নিজে থেকে হলেও সমস্যা নেই (ইতিহাস থেকে যেকোনো সময় ফেরানো যায়)।
      # GITHUB_TOKEN-এর মার্জ "push" ইভেন্ট চালু করে না, তাই বিল্ড আলাদা করে workflow_dispatch দিয়ে শুরু করা হয়
      - name: Auto-merge the pull request and start the APK build
        if: steps.gemini.outcome == 'success' && steps.report.outputs.nopr == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR=$(gh pr list --head "gemini/issue-$ISSUE_NUMBER" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then exit 0; fi
          if gh pr merge "$PR" --squash --delete-branch; then
            gh workflow run build-apk.yml --ref main
            gh issue comment "$ISSUE_NUMBER" --body "✔ Pull Request #$PR মার্জ হয়েছে। নতুন সংস্করণের বিল্ড শুরু হয়েছে — কয়েক মিনিট পরে অ্যাপে আপডেট বোতাম আসবে। কিছু ভুল হলে Claude-কে জানান।"
          else
            gh issue comment "$ISSUE_NUMBER" --body "⚠ Pull Request #$PR নিজে মার্জ করা গেল না (কনফ্লিক্ট বা অনুমতি)। GitHub-এ গিয়ে দেখুন।"
            exit 1
          fi

      - name: Fail the job if Gemini failed or opened no PR
        if: always() && (steps.gemini.outcome == 'failure' || steps.report.outputs.nopr == 'true')
        run: exit 1
