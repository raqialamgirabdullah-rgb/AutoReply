name: Gemini Agent

# ইস্যু বা পুল রিকোয়েস্টের কমেন্টে "@gemini-cli <কাজ>" লিখলে Gemini কাজটা করে নতুন ব্রাঞ্চে পুল রিকোয়েস্ট খোলে।
# শুধু রিপোজিটরির মালিক চালাতে পারবে; main-এ সরাসরি কিছু পুশ হয় না (আপনি দেখে মার্জ করবেন)।
on:
  issue_comment:
    types: [created]

concurrency:
  group: gemini-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gemini:
    if: >-
      startsWith(github.event.comment.body, '@gemini-cli') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "gemini-agent"
          git config user.email "gemini-agent@users.noreply.github.com"

      - name: Check Gemini key
        id: keycheck
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' -d '{"contents":[{"parts":[{"text":"hi"}]}]}' "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent" || echo 000)
          msg=$(python3 -c "import json;d=json.load(open('/tmp/r.json'));print(((d.get('error') or {}).get('message') or 'ok')[:300].replace('\n',' '))" 2>/dev/null || echo "unparsed")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "msg=$msg" >> "$GITHUB_OUTPUT"
          echo "Gemini key check: HTTP $code - $msg"

      - name: Run Gemini
        id: gemini
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"   # CI-তে ফোল্ডার বিশ্বস্ত না হলে Gemini CLI কাজ শুরুই করে না
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-flash-latest   # ডিফল্ট মডেল প্রায়ই 503 (চাপ বেশি) দেয়; এই মডেলে কী কাজ করে
          settings: |-
            {
              "tools": {
                "core": [
                  "read_file", "write_file", "replace", "glob", "search_file_content", "list_directory",
                  "run_shell_command(git)", "run_shell_command(gh)", "run_shell_command(ls)",
                  "run_shell_command(cat)", "run_shell_command(grep)", "run_shell_command(sed)"
                ]
              },
              "coreTools": [
                "read_file", "write_file", "replace", "glob", "search_file_content", "list_directory",
                "run_shell_command(git)", "run_shell_command(gh)", "run_shell_command(ls)",
                "run_shell_command(cat)", "run_shell_command(grep)", "run_shell_command(sed)"
              ]
            }
          prompt: |-
            তুমি এই রিপোজিটরির (Android/Kotlin অ্যাপ) একজন ডেভেলপার। আগে GEMINI.md পড়ো এবং তার নিয়ম মেনে চলো।
            কাজটা $REQUEST এনভায়রনমেন্ট ভ্যারিয়েবলে আছে (শুরুর "@gemini-cli" বাদ দিয়ে পড়ো); ইস্যু নম্বর $ISSUE_NUMBER, রিপো $REPO।
            ধাপগুলো:
            1. `git checkout -b gemini/issue-$ISSUE_NUMBER` দিয়ে নতুন ব্রাঞ্চ খোলো।
            2. কাজটা সবচেয়ে ছোট ও নিরাপদ বদলে করো। শুধু যা দরকার সেটুকু ফাইল বদলাও।
            3. কমিট করো এবং `git push -u origin HEAD` দিয়ে ব্রাঞ্চটা পুশ করো।
            4. `gh pr create --base main --fill` দিয়ে পুল রিকোয়েস্ট খোলো।
            5. `gh issue comment $ISSUE_NUMBER --body "<কী করলে ও কেন, এক-দুই লাইনে>"` দিয়ে সারসংক্ষেপ জানাও।
            কঠোর নিষেধ: main-এ সরাসরি পুশ নয়; .github/workflows, সাইনিং-সংক্রান্ত ফাইল, বা কোনো সিক্রেট ছোঁবে না।
            কাজটা করা সম্ভব না হলে কোড না বদলে ইস্যুতে কমেন্ট করে কারণ জানাও।

      - name: Report failure to the issue
        if: always() && steps.gemini.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.gemini.outcome }}
          KEY_CODE: ${{ steps.keycheck.outputs.code }}
          KEY_MSG: ${{ steps.keycheck.outputs.msg }}
          G_ERROR: ${{ steps.gemini.outputs.error }}
          G_SUMMARY: ${{ steps.gemini.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Gemini রান: **$OUTCOME** (API কী পরীক্ষা: HTTP ${KEY_CODE:-?} - ${KEY_MSG:-?})"
            if [ -n "$G_ERROR" ]; then echo; echo "ত্রুটি:"; echo '```'; printf '%s' "$G_ERROR" | head -c 1500; echo; echo '```'; fi
            if [ "$OUTCOME" != "success" ] && [ -n "$G_SUMMARY" ]; then echo; echo "আউটপুট:"; echo '```'; printf '%s' "$G_SUMMARY" | head -c 1200; echo; echo '```'; fi
            echo; echo "[রানের লিংক]($RUN_URL)"
          } > /tmp/report.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/report.md

      - name: Fail the job if Gemini failed
        if: steps.gemini.outcome == 'failure'
        run: exit 1
